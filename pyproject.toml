[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voyage-embeddings"
version = "0.1.0"
description = "Unified, contextualized embeddings pipelines using Voyage AI and ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Your Name" }]
dependencies = [
  "voyageai>=0.3.4",
  "chromadb>=0.5.0",
  "tiktoken>=0.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "pydantic>=2.8.2",
]

[project.scripts]
ve = "voyage_embeddings.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

