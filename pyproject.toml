[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sinevec"
version = "0.1.0"
description = "Sinevec: contextual embeddings pipelines using Voyage AI with a Qdrant vector store"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Your Name" }]
dependencies = [
  "voyageai>=0.3.4",
  "qdrant-client>=1.10.1",
  "tiktoken>=0.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "pydantic>=2.8.2",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
sinevec = "sinevec.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
